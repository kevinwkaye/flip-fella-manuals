<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Visual manuals for the Flip Fella family of Ableton plugins: panel maps, plain-English controls, footswitches and dial-in recipes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 8c22 0 40 13 42 36 2 22-12 46-42 48C20 94 6 72 8 48 10 24 28 8 50 8z' fill='%234d5bff'/%3E%3C/svg%3E">
<title>Pebble's Plugin Manuals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Roboto+Condensed:wght@400;700;800&display=swap">
<style>
/* Layout: one dark Flip Fella panel per plugin. Flip-card titles, a drawn panel map with numbered callouts, then recipe cards you copy onto the plugin. */
:root {
  color-scheme: dark;
  --bg: #070707;
  --face: #0e0e0e;
  --card: #1b1b1b;
  --card-hi: #262626;
  --ink: #f3f0e8;
  --dim: #a29e95;
  --faint: #5f5c56;
  --line: #333230;
  --red: #e8392f;
  --pebble: #4d5bff;
  --pebble-shade: #2329a8;
  --accent: #4d5bff;
  --display: "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.home { font-family: var(--display); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
.tabs { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { white-space: nowrap; flex: none; }
.tab { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); }
.tab:hover, .tab:focus-visible { color: var(--ink); border-color: var(--dim); outline: none; }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* flip cards */
.flip { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.fc { position: relative; display: inline-grid; place-items: center; min-width: .78em; padding: 0 .06em; height: 1.18em; background: linear-gradient(var(--card-hi), var(--card) 50%, #141414 50%, #121212); border-radius: .09em; font-family: var(--display); font-weight: 800; color: var(--ink); line-height: 1; box-shadow: 0 2px 0 #000; }
.fc::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: var(--bg); }
.flip { column-gap: .3em; row-gap: 4px; }
.fw { display: inline-flex; gap: 4px; white-space: nowrap; }
.fw + .fw { margin-left: .4em; }

/* index */
.hero { padding-block: 48px 24px; display: grid; gap: 16px; }
.hero h1 { font-size: clamp(34px, 7vw, 72px); margin: 0; }
.hero p { color: var(--dim); max-width: 60ch; margin: 0; font-size: 18px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; padding-block: 8px 56px; }
.tile > div { min-width: 0; }
.tile { display: grid; grid-template-columns: 76px 1fr; gap: 16px; align-items: center; padding: 20px; background: var(--face); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; transition: border-color .15s, transform .15s; }
.tile:hover, .tile:focus-visible { border-color: var(--tile); transform: translateY(-2px); outline: none; }
.tile h2 { margin: 0 0 4px; font-size: 26px; }
.tile .what { color: var(--dim); font-size: 15px; margin: 0; }
.tile .kind { font-family: var(--display); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--tile); font-weight: 700; margin: 0 0 6px; }
.howto { border-top: 1px solid var(--line); padding-block: 32px 64px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 24px; }
.howto h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: 15px; margin: 0 0 6px; }
.howto p { color: var(--dim); margin: 0; font-size: 15px; }

/* manual */
.manual { padding-block: 32px 72px; }
.mhead { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.mhead h1 { font-size: clamp(30px, 6.5vw, 64px); margin: 0 0 14px; }
.tagline { font-family: var(--display); text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-weight: 700; font-size: 14px; margin: 0 0 10px; }
.lede { font-size: 19px; max-width: 58ch; margin: 0; text-wrap: pretty; }
.mhead .pebble-big { width: clamp(90px, 16vw, 150px); }
section.part { padding-top: 44px; }
.eyebrow { font-family: var(--display); text-transform: uppercase; letter-spacing: .14em; font-size: 13px; color: var(--dim); font-weight: 700; margin: 0 0 6px; }
h2.st { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3.4vw, 34px); margin: 0 0 18px; text-wrap: balance; }
.intro { color: var(--dim); max-width: 64ch; margin: -6px 0 20px; }

/* flow */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.node { background: var(--card); border-radius: 10px; padding: 10px 14px; min-width: 0; max-width: 220px; }
.node b { display: block; font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: 14px; }
.node span { display: block; color: var(--dim); font-size: 14px; line-height: 1.35; }
.node.hot { background: var(--accent); color: #fff; }
.node.hot span { color: rgba(255,255,255,.85); }
.arrow { align-self: center; color: var(--faint); font-family: var(--display); font-weight: 800; font-size: 20px; }

/* quick start */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; counter-reset: s; padding: 0; margin: 0; list-style: none; }
.steps li { background: var(--face); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 18px; counter-increment: s; position: relative; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 40px; height: 46px; margin-bottom: 10px; font-family: var(--display); font-weight: 800; font-size: 28px; background: linear-gradient(var(--card-hi), var(--card) 50%, #131313 50%); border-radius: 5px; box-shadow: inset 0 -1px 0 #000; }
.steps li strong { display: block; margin-bottom: 4px; }
.steps li span { color: var(--dim); font-size: 15px; }

/* panel map */
.mapbox { background: var(--face); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
.mapbox svg { display: block; width: 100%; min-width: 720px; height: auto; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 4px 28px; margin-top: 22px; }
.li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.badge { width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 14px; }
.li b { font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 15px; display: block; }
.li p { margin: 2px 0 0; color: var(--dim); font-size: 15px; }
.li p em { color: var(--ink); font-style: normal; }

/* sub tables */
.subgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.sub { background: var(--face); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.sub h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 15px; margin: 0 0 10px; color: var(--accent); }
.sub dl { margin: 0; display: grid; grid-template-columns: minmax(90px, max-content) 1fr; gap: 8px 14px; font-size: 15px; }
.sub dt { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.sub dd { margin: 0; color: var(--dim); }

/* recipes */
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr)); gap: 18px; }
.rc { background: var(--face); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.rc-top { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.rc h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; }
.rc .for { font-family: var(--display); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--accent); font-weight: 700; margin: 0 0 4px; }
.rc .hear { margin: 6px 0 0; color: var(--dim); font-size: 15px; }
.rc-panel { background: var(--bg); flex: 1; }
.dials { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 12px 6px; padding: 16px 12px 6px; }
.kn { text-align: center; min-width: 0; }
.kn.wide { grid-column: 1 / -1; }
.kn svg { width: 54px; height: 54px; display: block; margin: 2px auto 0; }
.kn .l { font-family: var(--display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); line-height: 1.15; min-height: 2.3em; display: flex; align-items: flex-end; justify-content: center; }
.kn .r { font-family: var(--display); font-weight: 700; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.kn .n { font-size: 11px; color: var(--faint); line-height: 1.2; margin-top: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 16px; }
.chip { display: inline-flex; border-radius: 6px; overflow: hidden; font-family: var(--display); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line); }
.chip span { padding: 4px 8px; color: var(--dim); }
.chip b { padding: 4px 8px; background: var(--ink); color: var(--bg); }
.chip.on b { background: var(--accent); color: #fff; }
.rc .play { padding: 14px 18px 18px; font-size: 15px; margin: 0; border-top: 1px solid var(--line); margin-top: auto; }
.rc .play b { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--accent); display: block; margin-bottom: 2px; }

/* tips */
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tip { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; }
.tip b { display: block; margin-bottom: 2px; }
.tip span { color: var(--dim); font-size: 15px; }
.install { margin-top: 18px; background: var(--face); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; color: var(--dim); font-size: 15px; }
.install b { color: var(--ink); }
.install code { font-size: 13px; background: var(--card); padding: 1px 5px; border-radius: 4px; color: var(--ink); word-break: break-all; }

.foot { color: var(--faint); font-size: 13px; padding-block: 24px 40px; border-top: 1px solid var(--line); }

@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@media (prefers-reduced-motion: reduce) { .eye { animation: none; } .tile { transition: none; } }
@media (max-width: 640px) {
  .mhead { grid-template-columns: 1fr; }
  .mhead .pebble-big { order: -1; width: 84px; }
  .lede { font-size: 17px; }
}
</style>

</head>
<body>
<header class="bar"><div class="wrap">
  <a class="home" href="#" aria-label="All manuals"><svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><use href="#pebble"/></svg>Pebble's Plugin Manuals</a>
  <nav class="tabs" id="tabs" aria-label="Manuals"></nav>
</div></header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="pebble">
      <path d="M50 8c22 0 40 13 42 36 2 22-12 46-42 48C20 94 6 72 8 48 10 24 28 8 50 8z" fill="#2329a8" transform="translate(2 4)"/>
      <path d="M50 8c22 0 40 13 42 36 2 22-12 46-42 48C20 94 6 72 8 48 10 24 28 8 50 8z" fill="#4d5bff"/>

    </g>
  </defs>
</svg>

<main id="app"></main>

<script>
/* ---------- value readouts, copied from each plugin's own maths ---------- */
const pct = v => Math.round(v * 100) + '%';
const sec = s => s < 1 ? Math.round(s * 1000) + ' ms' : (s < 10 ? s.toFixed(1) : Math.round(s)) + ' s';
const hz = h => h < 1 ? h.toFixed(2) + ' Hz' : h.toFixed(1) + ' Hz';
const F = {
  step: (semis, rev) => { const n = ['UNISON','MIN 2ND','2ND','MIN 3RD','3RD','4TH','TRITONE','5TH','MIN 6TH','6TH','MIN 7TH','7TH','OCT']; const a = Math.abs(semis); const nm = a === 0 ? 'UNISON' : (semis > 0 ? '+' : '-') + (a === 24 ? '2 OCT' : n[a]); return (rev ? 'REV ' : 'FWD ') + nm + ' ' + (semis > 0 ? '+' + semis : semis < 0 ? String(semis) : '0'); },
  pct,
  clock: v => { const k = 64 * Math.pow(2, -5 * (1 - v)); const stops = [64,48,32,24,16,12,8,6,4,3,2]; let best = stops[0]; for (const s of stops) if (Math.abs(Math.log2(s / k)) < Math.abs(Math.log2(best / k))) best = s; return best + ' kHz'; },
  tape: v => { const r = [-4,-2,-1,-.5,.5,1,2,4][Math.floor(Math.min(v, 1) * 7.999)]; return F.step(Math.round(12 * Math.log2(Math.abs(r))), r < 0); },
  slip: v => { const i = Math.min(49, Math.floor(v * 50)); return i < 25 ? F.step(12 - i, true) : F.step(i - 37, false); },
  jEnvTime: v => v >= .95 ? 'Repeat' : v >= .9 ? 'Infinite' : sec(0.05 * Math.pow(400, Math.min(v / .9, 1))),
  jShape: v => ['Decay','Triangle','Square','Swell','Rise','Random'][Math.round(v * 5)],
  jLfo: v => hz(0.02 * Math.pow(2, v * 9)),
  jTone: v => v >= .995 ? 'Open' : (1.5 * Math.pow(13, v)).toFixed(1) + ' kHz',
  sShape: v => v < .45 ? 'Pluck' : v > .55 ? 'Swell' : 'Even',
  sMod: v => hz(0.05 * Math.pow(2, v * 7.3)),
  sFilter: v => { if (v >= .97) return 'Open'; if (v <= .04) return 'Shut'; const h = 30 * Math.pow(20000 / 30, v); return h < 1000 ? Math.round(h) + ' Hz' : (h / 1000).toFixed(1) + ' kHz'; },
  sTime: v => ['1 bar','1/2','1/4 dot','1/4','1/4 trip','1/8 dot','1/8','1/8 trip','1/16'][Math.round(v * 8)],
  sSpeed: v => { const s = 0.25 * Math.pow(16, v); return s < .3 ? '1/4X' : Math.abs(s - .5) < .01 ? '1/2X' : (Math.abs(s - Math.round(s)) < .01 ? Math.round(s) : s.toFixed(2)) + 'X'; },
  aRise: v => sec(0.08 * Math.pow(62.5, v)),
  aDecay: v => v >= .985 ? 'Infinite' : sec(0.03 * Math.pow(20 / 0.03, v / .985)),
  aRes: v => { const r = v * 2 - 1, p = Math.round(Math.abs(r) * 100); return p === 0 ? 'Off' : (r > 0 ? '+' + p + ' Upper' : '-' + p + ' Lower'); },
  aLayers: v => { const i = Math.round(v * 10); return i === 10 ? 'Infinite' : String(i + 1); },
  raw: v => String(Math.round(v * 100)),
  lit: v => '',
  ten: v => (Math.round(v * 100) / 10).toFixed(1)
};

/* ---------- the manuals ---------- */
const MANUALS = [];
const IMGS = {};
const GROUPS = [['Loopers and buffers', ['murmur','speckle','backtrack']], ['Synths and pitch', ['jetstream','changeling','bitrot','oilslick','divebomb']], ['Reverb and sustain', ['grotto','monolith','afterglow']], ['Modulation and filter', ['seasick','lathe','quack']], ['Multi-effect', ['prism-patch']]];
IMGS['afterglow']='img/afterglow.jpg';
IMGS['backtrack']='img/backtrack.jpg';
IMGS['bitrot']='img/bitrot.jpg';
IMGS['changeling']='img/changeling.jpg';
IMGS['divebomb-stomp']='img/divebomb-stomp.jpg';
IMGS['divebomb']='img/divebomb.jpg';
IMGS['grotto']='img/grotto.jpg';
IMGS['jetstream']='img/jetstream.jpg';
IMGS['lathe']='img/lathe.jpg';
IMGS['monolith']='img/monolith.jpg';
IMGS['murk']='img/murk.jpg';
IMGS['murmur']='img/murmur.jpg';
IMGS['oilslick']='img/oilslick.jpg';
IMGS['prism-patch']='img/prism-patch.jpg';
IMGS['quack-wah']='img/quack-wah.jpg';
IMGS['quack']='img/quack.jpg';
IMGS['seasick']='img/seasick.jpg';
IMGS['speckle']='img/speckle.jpg';
MANUALS.push({
  id: 'murmur', name: 'Murmur', accent: '#4d5bff', kind: 'Micro-looper + wet channel', ver: 'v0.3.0',
  tagline: 'Two channels, one clock, and a grumpy twin',
  lede: 'Murmur is a looper and an effects channel bent by one big CLOCK dial. Tap LOOP to record, tap WET for reverb, delay or slip echoes, then turn CLOCK down and everything slows, drops in pitch and gets gloriously grainy. Click the mode card and it becomes Murk, with six stranger effects and a Glue saturator.',
  what: 'Looper and wet channel bent by one clock. Now with Murk mode.',
  flow: [['Your playing','guitar, synth, anything'],['Wet Channel','reverb, delay or slip'],['Micro-Looper','records and replays'],['Clock','speed and pitch of it all',1],['Glue (Murk)','warm to wrecked'],['Mix','blend with your dry sound']],
  quick: [
    ['Drop it on a track','Put Murmur on an audio track with a guitar, synth or loop.'],
    ['Tap LOOP three times','Tap to record, play a phrase, tap to play it back. Tap again to stop.'],
    ['Turn the CLOCK down','Each click drops the loop by a fourth or a fifth and roughens it up.'],
    ['Try Murk','Click the MURMUR card by the title. Pick SOUP and turn up GLUE.']
  ],
  panel: { img: 'murmur', w: 960, h: 640, badges: [[1,140,24],[2,402,24],[3,734,22],[4,884,24],[5,38,122],[6,44,262],[7,190,262],[8,40,432],[9,396,116],[10,358,396],[11,358,444],[12,658,122],[13,660,262],[14,810,262],[15,660,432],[16,40,526]] },
  altImg: { img: 'murk', w: 960, h: 640, cap: 'The same panel in Murk mode. The cards relabel, a Glue slider appears under Mix, and Radio shows its five stations in the strip.' },
  legend: [
    ['Mode card','Click to swap between Murmur and Murk. Each mode keeps its own settings. Footswitches B and C held together do the same.'],
    ['Pages','<em>Panel</em> is the pedal. <em>Deep</em> holds the hidden options, Glue, Cross and levels. <em>Motion</em> holds ramping, tempo and Synth Mode. <em>Pedal</em> sets up footswitches and expression.'],
    ['A / Live / B','Two saved snapshots. Tap A or B to recall, hold to save the current panel into it. They store both modes.'],
    ['Keep','Logs this moment with the last 8 seconds of audio, so you can find sounds you liked later. Right-click for notes and Export.'],
    ['Wet mode','Murmur: <em>Reverb</em>, <em>Delay</em> or <em>Slip</em>. Murk: <em>Soup</em>, <em>Relay</em> or <em>Flip</em>. See the Murk table below.'],
    ['Time','Reverb: room size. Delay: echo time. Slip: how big each chunk is, from a blip to about a second.'],
    ['Modify (wet)','Reverb: how smeared the wash gets. Delay: how many repeats. Slip: speed and direction. The left half plays backwards, the right half forwards, each from an octave down to an octave up. 25% and 75% are normal speed. A flip card shows the step.'],
    ['WET switch','Tap to turn the Wet Channel on and off. Hold it to freeze whatever is ringing.'],
    ['Clock','The hero dial. Fully right is 64 kHz, clean and normal. Each step left slows and lowers everything and adds lo-fi grit. The flip cards show the rate.'],
    ['Routing','<em>In</em>: only your live playing goes through Wet. <em>Both</em>: playing and loop do. <em>Loop</em>: only the loop does, so you play clean over a wet loop.'],
    ['Mix','Dry on the left, effect on the right. In Murk a <em>Glue</em> slider sits under it, warm on the left, thrashed on the right.'],
    ['Loop mode','Murmur: <em>Env</em> stutters a slice while you play, <em>Tape</em> changes speed and direction, <em>Stretch</em> slows without changing pitch. Murk: <em>Burst</em>, <em>Radio</em> or <em>Mask</em>.'],
    ['Length','How much of the loop you hear. Fully right plays the whole thing.'],
    ['Modify (loop)','Env: how easily your playing triggers the stutter. Tape: eight speeds from 4x backwards to 4x forwards, shown on the card underneath. Stretch: stepped stretch, frozen at noon.'],
    ['LOOP switch','Tap to record, tap to play, tap to stop. Hold to overdub. With tempo sync on, loops round to whole beats.'],
    ['Pebble strip','Pebble shows what the looper is doing and reads out footswitch actions. In Murk Pebble turns grumpy, with heavy brows and a frown.']

/* ---------- drawing helpers ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pt = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };
function arc(cx, cy, r, a0, a1) {
  const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function knobSVG(v, accent, s = 100) {
  const c = s / 2, r = s * .38, a = -135 + 270 * v, [px, py] = pt(c, c, r * .62, a);
  return `<circle cx="${c}" cy="${c}" r="${r + s * .07}" fill="none" stroke="#2a2a2a" stroke-width="${s * .05}"/>`
    + `<path d="${arc(c, c, r + s * .07, -135, 135)}" fill="none" stroke="#2c2b29" stroke-width="${s * .05}" stroke-linecap="round"/>`
    + (v > .003 ? `<path d="${arc(c, c, r + s * .07, -135, a)}" fill="none" stroke="${accent}" stroke-width="${s * .05}" stroke-linecap="round"/>` : '')
    + `<circle cx="${c}" cy="${c}" r="${r}" fill="#1d1d1d"/><circle cx="${c}" cy="${c}" r="${r * .86}" fill="#151515"/>`
    + `<line x1="${c}" y1="${c}" x2="${px.toFixed(2)}" y2="${py.toFixed(2)}" stroke="#f3f0e8" stroke-width="${s * .055}" stroke-linecap="round"/>`;
}
const T = (x, y, t, o = {}) => `<text x="${x}" y="${y}" fill="${o.fill || '#a29e95'}" font-family="Roboto Condensed, Arial Narrow, sans-serif" font-size="${o.size || 12}" font-weight="${o.w || 700}" letter-spacing="${o.ls ?? 1}" text-anchor="${o.anchor || 'start'}">${esc(t)}</text>`;
function badge(n, x, y) { return n ? `<g><circle cx="${x}" cy="${y}" r="12" fill="#e8392f" stroke="#0e0e0e" stroke-width="2.5"/>${T(x, y + 4.5, n, { fill: '#fff', size: 13, anchor: 'middle', ls: 0, w: 800 })}</g>` : ''; }
function flipRect(x, y, w, h, txt) {
  const fs = Math.min(h * .56, w / Math.max(1, txt.length * .62));
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#1d1d1d"/><rect x="${x}" y="${y + h / 2}" width="${w}" height="${h / 2}" rx="6" fill="#161616"/>`
    + T(x + w / 2, y + h / 2 + fs * .36, txt, { fill: '#f3f0e8', size: fs.toFixed(1), anchor: 'middle', ls: 1, w: 800 })
    + `<line x1="${x}" y1="${y + h / 2}" x2="${x + w}" y2="${y + h / 2}" stroke="#070707" stroke-width="2"/>`;
}
function pills(x, y, w, h, items, sel, gap = 6) {
  const pw = (w - gap * (items.length - 1)) / items.length;
  return items.map((t, i) => { const px = x + i * (pw + gap), on = i === sel;
    return `<rect x="${px}" y="${y}" width="${pw}" height="${h}" rx="${Math.min(8, h / 2)}" fill="${on ? '#f3f0e8' : 'none'}" stroke="${on ? '#f3f0e8' : '#3a3a3a'}"/>`
      + T(px + pw / 2, y + h / 2 + 4.5, t, { fill: on ? '#070707' : '#f3f0e8', size: Math.min(13, pw / (t.length * .62)).toFixed(1), anchor: 'middle' }); }).join('');
}
function pebbleAt(x, y, w) { return `<use href="#pebble" x="0" y="0" width="100" height="100" transform="translate(${x} ${y}) scale(${w / 100})"/>`; }

function panelSVG(m) {
  const P = m.panel, A = m.accent; let s = '', b = '';
  if (P.img) {
    const bad = P.badges.map(([n, x, y]) => badge(n, x, y)).join('');
    return `<svg viewBox="0 0 ${P.w} ${P.h}" role="img" aria-label="The ${esc(m.name)} panel with numbered controls"><image href="${IMGS[P.img]}" x="0" y="0" width="${P.w}" height="${P.h}"/>${bad}</svg>`;
  }
  for (const e of P.els) {
    const k = e[0];
    if (k === 'title') s += T(e[1], e[2], e[3], { fill: '#f3f0e8', size: 26, w: 800, ls: 3 });
    else if (k === 'label') s += T(e[1], e[2], e[3], { size: 11, ls: 1.6 });
    else if (k === 'text') s += T(e[1], e[2], e[3], { anchor: e[4], fill: e[5] ? '#f3f0e8' : '#a29e95', size: e[5] ? 18 : 12 });
    else if (k === 'card') { s += flipRect(e[1], e[2], e[3], e[4], e[5]); b += badge(e[6], e[1], e[2]); }
    else if (k === 'pills') { s += pills(e[1], e[2], e[3], e[4], e[5], e[6]); b += badge(e[7], e[1], e[2]); }
    else if (k === 'presets') { s += pills(e[1], e[2], e[3], e[4], ['A', 'LIVE', 'B'], 1, 4); b += badge(e[5], e[1], e[2]); }
    else if (k === 'dial') { const [, x, y, w, h, l, v, n] = e, cx = x + w / 2, cy = y + 20 + (h - 44) / 2, sz = 86;
      s += T(cx, y + 12, l, { size: 11, anchor: 'middle', ls: 1.2 }) + `<g transform="translate(${cx - sz / 2} ${cy - sz / 2})">${knobSVG(v, A, sz)}</g>`;
      b += badge(n, x + 6, y + 4); }
    else if (k === 'big') { const [, x, y, w, h, stops, v, n] = e, cx = x + w / 2, cy = y + h / 2, R = Math.min(w, h) / 2 - 16;
      for (let i = 0; i < stops; i++) { const a = -135 + 270 * i / (stops - 1), [x0, y0] = pt(cx, cy, R + 4, a), [x1, y1] = pt(cx, cy, R + 12, a);
        s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${Math.abs(i / (stops - 1) - v) < .02 ? A : '#5f5c56'}" stroke-width="3" stroke-linecap="round"/>`; }
      s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#1b1b1b"/><circle cx="${cx}" cy="${cy}" r="${R * .8}" fill="#141414" stroke="#262626" stroke-width="2"/>`;
      const [px, py] = pt(cx, cy, R * .7, -135 + 270 * v); s += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#e8392f" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="#3c3c3c"/>`;
      b += badge(n, x + 10, y + 10); }
    else if (k === 'slider') { const [, x, y, w, h, l, v, n] = e, ty = y + h - 10;
      s += T(x, y + 11, l, { size: 11, ls: 1.2 }) + `<line x1="${x}" y1="${ty}" x2="${x + w}" y2="${ty}" stroke="#333" stroke-width="4" stroke-linecap="round"/><line x1="${x}" y1="${ty}" x2="${x + w * v}" y2="${ty}" stroke="${A}" stroke-width="4" stroke-linecap="round"/><circle cx="${x + w * v}" cy="${ty}" r="8" fill="#f3f0e8"/>`;
      b += badge(n, x - 24, y + 6); }
    else if (k === 'btn') { const [, x, y, w, h, t, on, n] = e;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${on ? A : '#1d1d1d'}"/>` + T(x + w / 2, y + h / 2 + 5, t, { fill: on ? '#070707' : '#f3f0e8', size: Math.min(14, h * .45), anchor: 'middle' });
      b += badge(n, x, y); }
    else if (k === 'foot') { const [, x, y, w, h, t, sub, n] = e, r = h * .36;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#141414" stroke="#2c2c2c"/><circle cx="${x + h / 2}" cy="${y + h / 2}" r="${r}" fill="#262626" stroke="#3c3c3c" stroke-width="3"/>`
        + T(x + h + 4, y + h / 2 + (sub ? -1 : 6), t, { fill: '#f3f0e8', size: 17, w: 800, ls: 2 }) + (sub ? T(x + h + 4, y + h / 2 + 15, sub, { size: 10, ls: .6 }) : '');
      b += badge(n, x, y); }
    else if (k === 'strip') { const [, x, y, w, h, st, n] = e;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#101010"/>` + pebbleAt(x + 16, y + 10, 72) + (st ? T(x + 106, y + 44, st, { fill: '#f3f0e8', size: 20, w: 800, ls: 2 }) : '');
      if (m.id === 'murmur') s += `<rect x="${x + 106}" y="${y + 58}" width="300" height="8" rx="4" fill="#262626"/><rect x="${x + 106}" y="${y + 58}" width="190" height="8" rx="4" fill="${A}"/>` + T(x + 106, y + 84, 'BUFFER', { size: 10 });
      b += badge(n, x + 10, y + 8); }
    else if (k === 'pebble') { s += pebbleAt(e[1], e[2], Math.min(e[3], e[4])); b += badge(e[5], e[1], e[2]); }
    else if (k === 'meter') { const [, x, y, w, h, n] = e, cx = x + w / 2, cy = y + h - 6, R = h - 22;
      s += `<path d="${arc(cx, cy, R, -60, 60)}" fill="none" stroke="#333" stroke-width="3"/>`;
      for (let i = -4; i <= 4; i++) { const [x0, y0] = pt(cx, cy, R - 2, i * 15), [x1, y1] = pt(cx, cy, R + (i === 0 ? 14 : 8), i * 15); s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${i === 0 ? '#f3f0e8' : '#5f5c56'}" stroke-width="2"/>`; }
      const [nx, ny] = pt(cx, cy, R + 4, 9); s += `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#e8392f" stroke-width="3" stroke-linecap="round"/>` + T(x, cy - 2, 'FLAT', { size: 10 }) + T(x + w, cy - 2, 'SHARP', { size: 10, anchor: 'end' });

    else if (k === 'keys') { const [, x, y, w, h, sel, n] = e, names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], cw = (w - 25) / 6, ch = (h - 6) / 2;
      names.forEach((t, i) => { const cx = x + (i % 6) * (cw + 5), cy = y + Math.floor(i / 6) * (ch + 6), on = i === sel;
        s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="5" fill="${on ? '#f3f0e8' : '#1d1d1d'}"/>` + T(cx + cw / 2, cy + ch / 2 + 5, t, { fill: on ? '#070707' : '#f3f0e8', size: 13, anchor: 'middle' }); });

        + T(x + 160, y + 19, 'B', { fill: '#ff7a59', size: 14 }) + `<rect x="${x + 178}" y="${y + 10}" width="120" height="8" rx="4" fill="#262626"/><rect x="${x + 178}" y="${y + 10}" width="30" height="8" rx="4" fill="#ff7a59"/>`; }
    else if (k === 'cells') { const [, x, y, w, h, c, n] = e, cw = (w - (c - 1) * 6) / c;
      for (let i = 0; i < c; i++) s += `<rect x="${x + i * (cw + 6)}" y="${y}" width="${cw}" height="${h}" rx="6" fill="${i < 2 ? '#1f3a37' : '#1a1a1a'}" stroke="${i === 0 ? A : '#2c2c2c'}"/>`;
      b += badge(n, x, y); }
    else if (k === 'bar') s += `<rect x="${e[1]}" y="${e[2]}" width="${e[3]}" height="${e[4]}" rx="5" fill="#262626"/><rect x="${e[1]}" y="${e[2]}" width="${e[3] * .4}" height="${e[4]}" rx="5" fill="${A}"/>`;
    else if (k === 'chips') { const [, x, y, w, h, items, n] = e, cw = (w - 12) / 3, ch = (h - 6) / 2;
      items.forEach((t, i) => { const cx = x + (i % 3) * (cw + 6), cy = y + Math.floor(i / 3) * (ch + 6); s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="6" fill="#1d1d1d"/>` + T(cx + cw / 2, cy + ch / 2 + 4.5, t, { fill: '#f3f0e8', size: 12, anchor: 'middle' }); });
      b += badge(n, x, y); }
    else if (k === 'banks') { const [, x, y, w, h, n] = e, cols = ['#e8392f', '#e8b923', '#5ec27a', '#4a90e2'], cw = (w - 15 * 6) / 16;
      for (let i = 0; i < 16; i++) s += `<rect x="${x + i * (cw + 6)}" y="${y}" width="${cw}" height="${h}" rx="6" fill="${i === 5 ? cols[Math.floor(i / 4)] : '#1a1a1a'}" stroke="${cols[Math.floor(i / 4)]}" stroke-opacity=".7"/>`;

      for (let i = 0; i < 4; i++) { const ly = y + 22 + i * 40, st = 20 + i * 30; s += `<rect x="${x + 14}" y="${ly}" width="${w - 28}" height="10" rx="5" fill="#1d1d1d"/><path d="M${x + 14 + st} ${ly + 10}l20 -10h${60 - i * 10}l${30 + i * 8} 10z" fill="${A}" opacity="${.9 - i * .18}"/>`; } }

function flipWord(word, size) { return `<span class="flip" style="font-size:${size}">${word.toUpperCase().split(' ').map(w => `<span class="fw">${[...w].map(ch => `<span class="fc">${esc(ch)}</span>`).join('')}</span>`).join('')}</span>`; }

function recipeCard(r, m) {
  const dials = (r.k || []).map(([l, v, f]) => `<div class="kn"><div class="l">${esc(l)}</div><svg viewBox="0 0 100 100" aria-hidden="true">${knobSVG(v, m.accent)}</svg><div class="r">${esc(f[0] === '=' ? f.slice(1) : F[f](v))}</div></div>`).join('')
    + (r.s || []).map(([l, v]) => `<div class="kn wide" style="text-align:left"><div class="l" style="justify-content:space-between;min-height:0"><span>${esc(l)}</span><span class="r">${F.raw(v)}%</span></div><svg viewBox="0 0 300 20" style="width:100%;height:20px" aria-hidden="true"><line x1="10" y1="10" x2="290" y2="10" stroke="#333" stroke-width="5" stroke-linecap="round"/><line x1="10" y1="10" x2="${10 + 280 * v}" y2="10" stroke="${m.accent}" stroke-width="5" stroke-linecap="round"/><circle cx="${10 + 280 * v}" cy="10" r="8" fill="#f3f0e8"/></svg></div>`).join('');
  const chips = (r.c || []).map(([l, val, on]) => `<span class="chip${on ? ' on' : ''}"><span>${esc(l)}</span><b>${esc(val)}</b></span>`).join('');
  return `<article class="rc"><div class="rc-top"><p class="for">${esc(r.for)}</p><h3>${esc(r.name)}</h3><p class="hear">${esc(r.hear)}</p></div>
    <div class="rc-panel"><div class="dials">${dials}</div>${chips ? `<div class="chips">${chips}</div>` : ''}</div><p class="play"><b>How to play it</b>${esc(r.play)}</p></article>`;
}

function presetSection(m) {
  if (!m.presets) return '';
  return `<section class="part"><p class="eyebrow">Ready to play</p><h2 class="st">Factory presets</h2><p class="intro">${m.presetsIntro || 'Each preset loads a finished sound with a tip on how to play it.'}</p><div class="mapbox" style="padding:4px 0"><table class="vt" style="min-width:0">${m.presets.map((r, i) => `<tr><th style="width:3em;color:var(--accent)">${i + 1}</th><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table></div></section>`;
}
function feetSection(m) {
  if (!m.feet) return '';
  return `<section class="part"><p class="eyebrow">Hands-free</p><h2 class="st">Footswitches</h2><p class="intro">${m.feetIntro || 'Optional. Everything works from the screen too. See the foot control guide on the home page for the one-off setup.'}</p><div class="mapbox" style="padding:4px 0"><table class="vt"><tr><th>Switch</th><th>Tap</th><th>Hold</th></tr>${m.feet.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td><td>${esc(r[2] || '')}</td></tr>`).join('')}</table></div>${m.exp ? `<p class="intro" style="margin-top:14px"><b style="color:var(--ink)">Expression pedal:</b> ${esc(m.exp)}</p>` : ''}</section>`;
}
function renderManual(m) {
  document.documentElement.style.setProperty('--accent', m.accent);
  const flow = m.flow.map(([b, s, hot], i) => (i ? '<span class="arrow" aria-hidden="true">→</span>' : '') + `<div class="node${hot ? ' hot' : ''}"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
  const legend = m.legend.map(([n, t], i) => `<div class="li"><span class="badge">${i + 1}</span><div><b>${esc(n)}</b><p>${t}</p></div></div>`).join('');
  const extra = m.extra ? `<section class="part"><p class="eyebrow">Beyond the panel</p><h2 class="st">The Deep and Motion pages</h2><div class="subgrid">${m.extra.map(([h, rows]) => `<div class="sub"><h3>${esc(h)}</h3><dl>${rows.map(([d, t]) => `<dt>${esc(d)}</dt><dd>${esc(t)}</dd>`).join('')}</dl></div>`).join('')}</div></section>` : '';
  const vars = m.variations ? `<section class="part"><p class="eyebrow">Eleven effects, four flavours</p><h2 class="st">What A, B, C and D do</h2><div class="mapbox" style="padding:4px 0"><table class="vt">${'<tr><th>Effect</th><th>A</th><th>B</th><th>C</th><th>D</th></tr>' + m.variations.map(r => `<tr><th>${esc(r[0])}</th>${r.slice(1).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></section>` : '';
  return `<article class="manual wrap">
    <header class="mhead"><div><p class="tagline">${esc(m.kind)} · ${esc(m.tagline)}</p><h1>${flipWord(m.name, 'inherit')}</h1><p class="lede">${esc(m.lede)}</p></div>
      <svg class="pebble-big" viewBox="0 0 100 100" role="img" aria-label="Pebble"><use href="#pebble"/></svg></header>
    <section class="part"><p class="eyebrow">How the sound travels</p><h2 class="st">The big picture</h2><div class="flow">${flow}</div></section>
    <section class="part"><p class="eyebrow">Sound in a minute</p><h2 class="st">Quick start</h2><ol class="steps">${m.quick.map(([a, b]) => `<li><strong>${esc(a)}</strong><span>${esc(b)}</span></li>`).join('')}</ol></section>
    <section class="part"><p class="eyebrow">Every control, numbered</p><h2 class="st">The panel</h2><div class="mapbox">${panelSVG(m)}</div><div class="legend">${legend}</div>${m.altImg ? `<figure style="margin:24px 0 0"><div class="mapbox"><svg viewBox="0 0 ${m.altImg.w} ${m.altImg.h}" role="img" aria-label="${esc(m.altImg.cap)}"><image href="${IMGS[m.altImg.img]}" width="${m.altImg.w}" height="${m.altImg.h}"/></svg></div><figcaption class="intro" style="margin:10px 0 0">${esc(m.altImg.cap)}</figcaption></figure>` : ''}</section>
    ${extra}${vars}${presetSection(m)}${feetSection(m)}${!m.noKeeper ? `<section class="part"><p class="eyebrow">Remember good sounds</p><h2 class="st">Keeper</h2><p class="intro">Click KEEP, or hold footswitches C and D for a second, to save every setting plus the last 8 seconds of audio to Documents, Flip Fella Keepers. Use the arrow next to KEEP to add a note or export a zip. <a href="#" onclick="setTimeout(()=>document.getElementById('keeper-guide')?.scrollIntoView(),300)">Read the full Keeper guide</a>.</p></section>` : ''}
    <section class="part"><p class="eyebrow">Dial these in</p><h2 class="st">Recipes</h2><p class="intro">Copy the dials and switches onto the plugin. The value under each dial matches what the plugin shows. Anything not listed can stay where it is.</p><div class="recipes">${m.recipes.map(r => recipeCard(r, m)).join('')}</div></section>
    <section class="part"><p class="eyebrow">Handy to know</p><h2 class="st">Tips and fixes</h2><div class="tips">${m.tips.map(([a, b]) => `<div class="tip"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div><div class="install"><b>Installing:</b> ${m.install}</div></section>
  </article>`;
}

function renderIndex() {
  document.documentElement.style.setProperty('--accent', '#4d5bff');
  return `<div class="wrap"><section class="hero"><h1>${flipWord('Manuals', 'inherit')}</h1><p>Fifteen plugins, one family. Pick a plugin for a numbered map of its panel, plain-English controls and recipes you can dial straight in.</p></section>
    ${GROUPS.map(([g, ids]) => `<p class="eyebrow" style="margin-top:18px">${esc(g)}</p><div class="shelf" style="padding-block:4px 20px">${ids.map(id => MANUALS.find(x => x.id === id)).filter(Boolean).map(m => `<a class="tile" href="#${m.id}" style="--tile:${m.accent}"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#pebble"/></svg><div><p class="kind">${esc(m.kind)}</p><h2>${flipWord(m.name, '19px')}</h2><p class="what">${esc(m.what)}</p></div></a>`).join('')}</div>`).join('')}
    <section class="part" style="padding-top:8px"><p class="eyebrow">Set up once, works everywhere</p><h2 class="st">Footswitches and expression</h2>
    <p class="intro">Every plugin works from the screen, so pedals are optional. The whole family shares one footswitch setup, saved on your computer, so you only do this once and every plugin picks it up.</p>
    <ol class="steps">
      <li><strong>Four switches</strong><span>Set your MIDI footswitch\'s first four switches to send momentary CC 20, 21, 22 and 23 on channel 16 (127 pressed, 0 released). Or press Learn on the plugin\'s Pedal page.</span></li>
      <li><strong>Expression pedal</strong><span>Set it to CC 11 on channel 16, or use Learn. Then choose Calibrate and rock it from heel to toe once.</span></li>
      <li><strong>Let Ableton let go</strong><span>In Ableton\'s MIDI preferences, turn Track, Sync and Remote off for the footswitch. The plugin then reads it straight from the USB cable, with no MIDI track.</span></li>
      <li><strong>Check the dot</strong><span>The dot by FOOTSWITCHES turns green and Pebble says FOOTSWITCHES READY. If it stays grey, click FOOTSWITCHES to see why.</span></li>
    </ol>
    <div class="tips" style="margin-top:18px">
      <div class="tip"><b>Same feel everywhere</b><span>A hold is 0.45 s. Two switches within 0.12 s count as a pair. A pair held for 1 s is the long version. Nothing needs a double-tap.</span></div>
      <div class="tip"><b>C + D is always the same</b><span>Tap to hand the footswitches to the next copy of that plugin. Hold for a second to save a Keeper.</span></div>
      <div class="tip"><b>Keeper</b><span>Saves every setting and the last 8 seconds of audio to Documents, Flip Fella Keepers, so you can find sounds you liked later.</span></div>
      <div class="tip"><b>Several plugins at once</b><span>Only one plugin type can hold the footswitch cable on Windows. For a second type, route the footswitch through an Ableton MIDI track instead.</span></div>
    </div></section>
    <section class="part" style="padding-top:8px" id="keeper-guide"><p class="eyebrow">That sounded good, remember it</p><h2 class="st">Keeper</h2>
    <p class="intro">When you hit something you love mid-jam, press Keeper and the plugin saves that moment so you can find it again later.</p>
    <div class="subgrid">
      <div class="sub"><h3>What it saves</h3><dl>
        <dt>Settings</dt><dd>Every setting on the plugin at that instant, including where the expression pedal sat.</dd>
        <dt>Tempo</dt><dd>The tempo you were playing at.</dd>
        <dt>Audio</dt><dd>The last 8 seconds, both your dry input and what came out of the plugin, as WAV files.</dd>
        <dt>State</dt><dd>What the engine was doing, for example a loop playing or Magic running away.</dd>
        <dt>Where</dt><dd>Documents, Flip Fella Keepers, on whichever computer you\'re using.</dd></dl></div>
      <div class="sub"><h3>How to trigger it</h3><dl>
        <dt>Screen</dt><dd>Click KEEP on the panel.</dd>
        <dt>Footswitch</dt><dd>Hold C and D together for a second. Holding the pair never fires either switch\'s own job, so Keeper can\'t change the sound you\'re capturing.</dd></dl>
        <h3 style="margin-top:16px">The arrow next to KEEP</h3><dl>
        <dt>Note</dt><dd>Add a note, like \u201cgreat for the bridge of the new song\u201d.</dd>
        <dt>Export</dt><dd>Make a zip you can hand straight to Claude.</dd>
        <dt>Folder</dt><dd>Open the Keepers folder.</dd>
        <dt>Live or Studio</dt><dd>Changes how it saves.</dd>
        <dt>Learn</dt><dd>Use a dedicated Keeper footswitch instead of C and D.</dd></dl></div>
      <div class="sub"><h3>Why it matters</h3><p style="margin:0;color:var(--dim);font-size:15px">Each Keeper is a real example of a sound you liked, with the exact settings and audio attached. Build up a pile across the plugins, export them, and Claude can look for patterns in what you keep reaching for: how much modulation, how long the tails, which voicings come up again and again. That becomes the starting point for your own signature suite of plugins.</p>
      <p style="margin:14px 0 0;color:var(--dim);font-size:15px">Every plugin in the family has it.</p></div>
    </div></section>
    <div class="howto"><div><h3>Read the map</h3><p>Each manual draws the plugin panel with red numbers. The list under it explains each number in plain words.</p></div>
    <div><h3>Dial the recipes</h3><p>Each recipe shows dials at the right angle with the value the plugin displays, plus the switches to set.</p></div>
    <div><h3>Start from Live</h3><p>Every plugin opens on Live. Hold A or B to save a recipe you like so you can call it back with one tap.</p></div></div></div>`;
}

const app = document.getElementById('app'), tabs = document.getElementById('tabs');
function route() {
  const id = location.hash.slice(1), m = MANUALS.find(x => x.id === id);
  app.innerHTML = m ? renderManual(m) : renderIndex();
  tabs.innerHTML = MANUALS.map(x => `<a class="tab" href="#${x.id}"${x === m ? ' aria-current="page"' : ''}>${esc(x.name)}</a>`).join('');
  document.title = m ? m.name + ' manual' : "Pebble's Plugin Manuals";
  window.scrollTo(0, 0);
  const cur = tabs.querySelector('[aria-current]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
}
window.addEventListener('hashchange', route);
route();
</script>
<style>
.vt { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px; }
.vt th, .vt td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.vt tr:first-child th { font-family: var(--display); letter-spacing: .1em; color: var(--accent); }
.vt th { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.vt td { color: var(--dim); }
</style>

</body>
</html>
